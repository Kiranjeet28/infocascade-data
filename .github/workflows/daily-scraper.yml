name: Daily Timetable Scraper

on:
  schedule:
    # Every day at 12:00 AM UTC
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-timetable-scraper
  cancel-in-progress: false

jobs:
  scrape:
    name: Run Timetable Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install

      - name: Run Timetable Scraper
        run: |
          echo "::group::Running scraper"
          node scrapers/runAllTimetables.js
          echo "::endgroup::"

      - name: Check for JSON Changes
        id: changes
        shell: bash
        run: |
          echo "::group::Git Status"
          git status
          echo "::endgroup::"

          git add public web data 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected:"
            git diff --cached --name-status
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update timetable data"

      - name: Push Changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin main